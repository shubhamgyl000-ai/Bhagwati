<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="style.css">
    <title>Simple Cart</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
            margin: 20px;
        }
        .product {
            border: 1px solid #ccc;
            padding: 10px;
            margin: 10px;
            width: 200px;
            display: inline-block;
        }
        .cart {
            margin-top: 20px;
            border-top: 2px solid white;
            padding-top: 10px;
        }
        .add-cart:hover { background: #3a3a3a; }

        button {
            padding: 5px 10px;
            cursor: pointer;
            background-color: white;
        }
        .buy-now {
      background: #000;
      color: #fff;
      border: 1px solid #666;
      padding: 15px;
      size: 100px;
      text-align: center;
    }
    .buy-now:hover { background: #1a1a1a; }

    </style>
</head>
<body>

   <header>
    <h1>BHAGWATI READYWEAR</h1>
    <p>Premium Gents Readywear</p>
</header>
<h2>Products</h2> 

<div class="product">
    <h3>SHIRT</h3>
    <p>Price: ₹1,499 <img src="shirt.webp" alt="Image Error" width="100" height="100"></p>
    <button onclick="addToCart('SHIRT', 1499)">Add to Cart</button>
</div>

<div class="product">
    <h3>PANTS</h3>
    <p>Price: ₹1,599 <img src="pant.jpg" alt="Image Error" width="100" height="100"> </p>
    <button onclick="addToCart('PANTS', 1599)">Add to Cart</button>
</div>

<div class="product">
    <h3>TSHIRT</h3>
    <p>Price: ₹699 <img src="tshirt.webp" alt="Image Error" width="100" height="100"></p>
    <button onclick="addToCart('TSHIRT', 699)">Add to Cart</button>
</div>

<div class="product">
    <h3>LOWER</h3>
    <p>Price: ₹1,399 <img src="lower.jpeg" alt="Image Error" width="100" height="100"></p>
    <button onclick="addToCart('LOWER', 1399)">Add to Cart</button>
</div>

<div class="cart">
    <h2>Cart</h2>
    <ul id="cartItems"></ul>
    <h3>Total: ₹<span id="total">0</span></h3>
</div>

<script>
    let total = 0;

    function addToCart(item, price) {
        const cartItems = document.getElementById("cartItems");
        const li = document.createElement("li");
        li.textContent = item + " - ₹" + price;

        // Remove button
        const removeBtn = document.createElement("button");
        removeBtn.textContent = " Remove";
        removeBtn.onclick = function () {
            cartItems.removeChild(li);
            total -= price;
            document.getElementById("total").textContent = total;
        };

        li.appendChild(removeBtn);
        cartItems.appendChild(li);

        total += price;
        document.getElementById("total").textContent = total;
    }
</script>
<button class="buy-now"><a href="payment.html">BUY</button></a>
<footer>
    <p>© 2026 Bhagwati Readywear</p>
</footer>

</body>
</html>
