<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UPI Payment | Premium Wear</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

    body {
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .wrapper {
      width: 100%;
      max-width: 380px;
      background: #1b1b1b;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7);
    }

    h2 {
      text-align: center;
      margin-bottom: 18px;
      color: #fff;
    }

    .amount {
      text-align: center;
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab {
      flex: 1;
      padding: 10px;
      background: #121212;
      border: 1px solid #333;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      font-size: 14px;
    }

    .tab.active {
      background: #000;
      border-color: #555;
      color: #fff;
    }

    .upi-section {
      text-align: center;
    }

    .upi-section img {
      width: 200px;
      margin: 15px auto;
      display: block;
      border-radius: 10px;
      background: #fff;
      padding: 10px;
    }

    .upi-id {
      background: #121212;
      padding: 12px;
      border-radius: 10px;
      border: 1px dashed #444;
      font-size: 14px;
      margin-top: 10px;
      color: #bdbdbd;
    }

    .apps {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      font-size: 13px;
      color: #9e9e9e;
    }

    .pay-btn {
      margin-top: 25px;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: #000;
      color: #fff;
      border: 1px solid #555;
      font-size: 16px;
      cursor: pointer;
    }

    .pay-btn:hover {
      background: #1a1a1a;
    }

    .secure {
      margin-top: 14px;
      text-align: center;
      font-size: 12px;
      color: #8f8f8f;
    }

    @media (max-width: 400px) {
      .wrapper { padding: 20px; }
    }
  </style>
</head>
<body>

<div class="wrapper">
  <h2>Pay with UPI</h2>
  <div class="amount">Total</div>

  <div class="tabs">
    <div class="tab active">UPI QR</div>
    <div class="tab">UPI ID</div>
  </div>

  <div class="upi-section">
    <!-- Replace QR image with your real UPI QR -->
    <img src="payment.jpeg" alt="UPI QR Code">
    <div class="upi-id">pyaar3399@oksbi</div>
  </div>

  <div class="apps">
    <span>GPay</span>
    <span>PhonePe</span>
    <span>Paytm</span>
    <span>BHIM</span>
    <span>Navi</span>
  </div>

  <button class="pay-btn">I have paid</button>

  <div class="secure">🔒 Secure UPI Payment</div>
</div>

</body>

</html>
